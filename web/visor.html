<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#040a12">
<!-- ojo: el título no termina en «· Maicol» (así la pestaña lateral no la confunde con el tablero) -->
<title>Maicol — pizarra</title>
<link rel="icon" href="/static/jarvis.png">
<style>
/* La pizarra que sale al costado del tablero de análisis cuando Maicol explica algo con un visual.
   La ventana la saca la pestaña lateral (desde detrás del tablero); aquí el contenido entra como un vidrio que se aclara. */
:root { --fondo: #040a12; --borde: rgba(0, 229, 255, .2); --cian: #00e5ff; --cian-2: #7af4ff; --tenue: #7c97a8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: #dcefff; font: 400 14px/1.45 "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(90% 60% at 30% 0%, rgba(0, 229, 255, .09), transparent 70%), var(--fondo); }
.cab { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px 18px; }
.reactor { width: 14px; height: 14px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, #fff 0 18%, var(--cian) 32%, rgba(0, 229, 255, .15) 62%, transparent 70%);
  box-shadow: 0 0 14px var(--cian); animation: latido 2.4s ease-in-out infinite; }
@keyframes latido { 50% { box-shadow: 0 0 5px var(--cian); transform: scale(.88); } }
.cab div { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.cab small { font-size: 10px; letter-spacing: .3em; color: var(--cian-2); }
.cab b { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--borde); background: rgba(6, 18, 30, .8);
  color: var(--tenue); cursor: pointer; font: inherit; }
.cab button:hover { color: #fff; border-color: var(--cian); }
.escena { position: absolute; inset: 62px 12px 12px; }
.escena iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 14px; background: transparent;
  transition: opacity .55s ease, filter .7s ease, transform .7s cubic-bezier(.2, .9, .25, 1); }
.escena iframe.llega { opacity: 0; filter: blur(16px); transform: translateY(14px) scale(.98); }
.escena iframe.se-va { opacity: 0; filter: blur(14px); transform: translateY(-12px) scale(1.02); pointer-events: none; }
/* entrada: vidrio que se aclara y un destello que lo cruza */
.cab, .escena { transition: opacity .55s ease, filter .8s ease, scale .8s cubic-bezier(.2, .9, .3, 1); }
body.entrando .cab, body.entrando .escena { opacity: 0; filter: blur(20px); scale: .95; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; transform: translateX(-110%);
  background: linear-gradient(115deg, transparent 35%, rgba(122, 244, 255, .10) 47%, rgba(255, 255, 255, .18) 50%, transparent 62%); }
body.aparecio::after { animation: destello 1.1s cubic-bezier(.3, .7, .3, 1) .15s; }
@keyframes destello { to { transform: translateX(110%); } }
</style>
</head>
<body class="entrando">
<header class="cab">
  <span class="reactor" aria-hidden="true"></span>
  <div><small>MAICOL · PIZARRA</small><b id="titulo">Pizarra</b></div>
  <button id="cerrar" title="Guardar la pizarra">✕</button>
</header>
<main id="escena" class="escena"></main>
<script>
const params = new URLSearchParams(location.search);
const $ = (s) => document.querySelector(s);

// cada visual nuevo entra como vidrio y el anterior se va desenfocándose hacia arriba
function mostrar(id, titulo) {
  if (!id) return;
  $("#titulo").textContent = titulo || "Pizarra";
  const viejos = [...$("#escena").children];
  const f = document.createElement("iframe");
  f.className = "llega"; f.title = titulo || "Visual";
  f.src = `/visual/${encodeURIComponent(id)}`;
  f.onload = () => requestAnimationFrame(() => {
    f.classList.remove("llega");
    for (const v of viejos) { v.classList.add("se-va"); setTimeout(() => v.remove(), 800); }
  });
  $("#escena").appendChild(f);
}

let ws = null, reintentos = 0;
function conectar() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?dispositivo=visor`);
  ws.onopen = () => { reintentos = 0; };
  ws.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch (_) { return; }
    if (ev.type === "visual_lado") mostrar(ev.id, ev.titulo);
    else if (ev.type === "visual" && ev.cerrar) guardarse();  // «cierra eso»: se guarda
    else if (ev.type === "visual_lado_cerrar") guardarse();  // la charla ya va en otra cosa: se guarda sola
  };
  ws.onclose = () => setTimeout(conectar, Math.min(10000, 800 * 2 ** reintentos++));
}

// al guardarla, el contenido se desenfoca y la ventana se va; el tablero vuelve a su lugar (lo hace la pestaña lateral)
function guardarse() { document.body.classList.add("entrando"); setTimeout(() => window.close(), 380); }
$("#cerrar").onclick = guardarse;
mostrar(params.get("v"), params.get("t"));
conectar();

// la entrada empieza cuando la ventana se pone a crecer desde el tablero; si nadie la mueve, empieza sola
function aparecer() {
  if (!document.body.classList.contains("entrando")) return;
  document.body.classList.remove("entrando");
  document.body.classList.add("aparecio");
}
addEventListener("resize", () => setTimeout(aparecer, 80), { once: true });
setTimeout(aparecer, 900);
</script>
</body>
</html>
